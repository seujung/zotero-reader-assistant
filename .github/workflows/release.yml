name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: VERSION="${GITHUB_REF_NAME#v}" REPOSITORY="$GITHUB_REPOSITORY" ./build.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/zotero-reader-assistant-*.xpi \
            build/zotero-reader-assistant.xpi \
            build/updates.json \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
